<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Coach AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="onboarding" class="card onboarding">
      <div class="eyebrow">Speak English. Get corrected instantly.</div>
      <h1>English Coach AI</h1>
      <p>Choose your level. The coach speaks and corrects you in English.</p>
      <div class="level-grid" id="levelGrid"></div>
      <div class="onboarding-actions">
        <button id="startBtn" class="primary" disabled>Start conversation</button>
        <a class="secondary-button author-link" href="https://www.linkedin.com/in/anastasiia-mozyra/" target="_blank" rel="noopener noreferrer">Contact the developer</a>
      </div>
    </section>

    <section id="chatScreen" class="chat-screen hidden">
      <header class="topbar">
        <div>
          <strong>English Coach AI</strong>
          <span id="levelBadge" class="badge"></span>
        </div>
        <button id="changeLevelBtn" class="ghost">Change level</button>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <form id="chatForm" class="composer">
        <button type="button" id="micBtn" class="icon-btn" aria-label="Voice input">🎙</button>
        <textarea id="messageInput" rows="1" placeholder="Write or speak in English …" required></textarea>
        <button type="submit" id="sendBtn" class="primary compact">Send</button>
      </form>
      <div class="controls">
        <label><input type="checkbox" id="autoSpeak" checked /> Read response aloud</label>
        <span id="status"></span>
      </div>
      <footer class="chat-footer">
        <a class="author-link" href="https://www.linkedin.com/in/anastasiia-mozyra/" target="_blank" rel="noopener noreferrer">Contact the developer</a>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
